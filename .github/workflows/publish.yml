name: Publish Python Distribution to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC), not a stored API token. PyPI
# is configured to trust exactly this repository, this workflow file, and the
# `pypi` environment below; changing any of those three names requires updating
# the publisher at https://pypi.org/manage/project/pythodds/settings/publishing/.
#
# Build and publish are separate jobs on purpose. Only `publish` can mint an
# OIDC token, and it runs no project or build-backend code — it just uploads the
# files `build` handed over. Actions are pinned to commit hashes because tags
# can be repointed at other code; bump them with the same 72-hour cooling-off
# that `exclude-newer` applies to packages.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Show uv version
        run: uv --version

      # Guards against tagging v0.25.0 while pyproject.toml still says 0.24.0,
      # which would publish the wrong version under the right tag.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          test "$tag" = "$version" ||
            (echo "ERROR: tag $GITHUB_REF_NAME does not match project version $version" && exit 1)

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pythodds
    permissions:
      id-token: write # mints the short-lived OIDC token PyPI exchanges for an upload credential

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      # `always` fails loudly if OIDC is unavailable; `automatic` would quietly
      # fall back to looking for a token that no longer exists. Attestations
      # (PEP 740) are uploaded by default and are not suppressed here.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
