[project]
name = "pythodds"
version = "0.21.0"
description = "Command line utilities for statistics, odds, and probabilities"
readme = "README.md"
authors = [
    {name = "Nicholas Carsner", email = "nicholascarsner@gmail.com"},
]
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.4.3",
    "scipy>=1.17.1",
]

keywords = ["statistics", "probability", "binomial", "odds", "correlation", "distribution", "confidence", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
binom = "src.utils.binomial_distribution:main"
birthday = "src.utils.birthday_problem:main"
normal = "src.utils.normal_gaussian:main"
poisson = "src.utils.poisson_distribution:main"
expected = "src.utils.expected_value:main"
streak = "src.utils.streak_probability:main"
simulate = "src.utils.monte_carlo:main"
bayes = "src.utils.bayes_theorem:main"
pythag = "src.utils.pythagorean_record:main"
pearson = "src.utils.pearson_correlation:main"
spearman = "src.utils.spearman_correlation:main"
sample = "src.utils.sample_size:main"
prime = "src.utils.prime_numbers:main"
linreg = "src.utils.linear_regression:main"
bootci = "src.utils.bootstrap_confidence_intervals:main"
forecast = "src.utils.forecast_time_series:main"
collatz = "src.utils.collatz_conjecture:main"
confint = "src.utils.confidence_intervals:main"
pvalue = "src.utils.probability_values:main"
zscore = "src.utils.z_score:main"
ttest = "src.utils.t_test:main"
jevons = "src.utils.jevons_paradox:main"
sigmoid = "src.utils.sigmoid:main"
euler = "src.utils.euler:main"
gini = "src.utils.gini:main"
crt = "src.utils.crt:main"
subnet = "src.utils.subnet:main"
geometric = "src.utils.geometric_distribution:main"
chisq = "src.utils.chi_squared:main"
anova = "src.utils.anova:main"
life = "src.utils.life_in_weeks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot silently change what is enforced.
# The repo previously carried no ruff config and inherited ruff's defaults;
# ruff 0.16.0 then widened those defaults and surfaced 173 new findings.
#
# This is ruff's pre-0.16 default set (E4/E7/E9/F) plus import sorting, which
# the pre-commit hook previously passed as --extend-select=I.
#
# line-length is intentionally left at the default 88, which is what the
# formatter has always used here. The hook's old --line-length=120 applied
# only to `ruff check` and was inert: E501 lives in E5, which is not selected.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=tests/_*.py --cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
core = "sysmon"
source = ["src"]
omit = [
    "src/__init__.py",
    "src/utils/__init__.py",
    "tests/*",
    "tests/__init__.py",
    "_*.py",
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__"',
]
